 <!DOCTYPE html>
<html>
<head>
    <title>Instagram Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: white;
            border: 1px solid #dbdbdb;
            width: 350px;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
        }

        .logo {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            box-sizing: border-box;
            border: 1px solid #dbdbdb;
            background-color: #fafafa;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #4cb5f9;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .or {
            margin: 25px 0;
            color: gray;
        }

        .facebook {
            color: #385185;
            font-weight: bold;
        }

        .forgot {
            color: #00376b;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">Instagram</div>

        <form>
            <input type="text" placeholder="Phone number, username, or email">

            <input type="password" placeholder="Password">

            <button type="button">Log in</button>
        </form>

        <div class="or">──────── OR ────────</div>

        <div class="facebook">Log in with Facebook</div>

        <div class="forgot">Forgot password?</div>

    </div>

</body>
</html>
